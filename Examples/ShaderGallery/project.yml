# XcodeGen spec for ShaderGallery.xcodeproj. The project file is committed, so XcodeGen is only
# needed after changing this file: run `xcodegen` in this folder.
name: ShaderGallery
options:
  bundleIdPrefix: io.github.muhittincamdali
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  SwiftShaders:
    path: ../..
targets:
  ShaderGallery:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [ShaderGallery]
    dependencies:
      - package: SwiftShaders
        product: SwiftShaders
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Shader Gallery
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Sign to run locally on the Mac; the simulator needs no signing.
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  ShaderGallery:
    build:
      targets:
        ShaderGallery: all
    run:
      config: Debug
