# Managed by the repository kit (muhittincamdali/.github). Edit the inputs, keep the structure.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  swift:
    permissions:
      contents: read
    uses: muhittincamdali/.github/.github/workflows/swift-ci.yml@5d3c4432dae8895b16ce3caa2f78398966953212 # v1
    with:
      platforms: '["iOS","macOS"]'
      scheme: SwiftShaders
      test-on-simulator: true
      # `swift test` needs the compiled default.metallib. SwiftPM compiles .metal files with the
      # Swift Build engine, its default build system from Swift 6.4; the runner image's older
      # toolchain uses the native one, which only copies them. The package job still builds the
      # package and its tests; macos-tests.yml runs them through xcodebuild, which compiles the
      # shaders, and the iOS job runs them on a simulator.
      test: false
